<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1180" font-family="Poppins, 'Inter', 'Plus Jakarta Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <symbol id="bk-color" viewBox="0 0 100 100">
      <rect x="0" y="0" width="100" height="100" rx="22" fill="#0B1F3A"/>
      <rect x="30" y="20" width="13" height="60" rx="3" fill="#FFFFFF"/>
      <path d="M43,20 H60 L66,26 Q69,29 69,35 Q69,49 54,49 H43 Z" fill="#FFFFFF"/>
      <path d="M46,55 L75,27" stroke="#C8102E" stroke-width="11" stroke-linecap="square" fill="none"/>
      <path d="M46,59 L75,89" stroke="#C8102E" stroke-width="11" stroke-linecap="square" fill="none"/>
    </symbol>

    <symbol id="bk-ondark" viewBox="0 0 100 100">
      <rect x="0" y="0" width="100" height="100" rx="22" fill="#FFFFFF"/>
      <rect x="30" y="20" width="13" height="60" rx="3" fill="#0B1F3A"/>
      <path d="M43,20 H60 L66,26 Q69,29 69,35 Q69,49 54,49 H43 Z" fill="#0B1F3A"/>
      <path d="M46,55 L75,27" stroke="#E8433D" stroke-width="11" stroke-linecap="square" fill="none"/>
      <path d="M46,59 L75,89" stroke="#E8433D" stroke-width="11" stroke-linecap="square" fill="none"/>
    </symbol>

    <symbol id="bk-mono" viewBox="0 0 100 100">
      <rect x="30" y="20" width="13" height="60" rx="3" fill="currentColor"/>
      <path d="M43,20 H60 L66,26 Q69,29 69,35 Q69,49 54,49 H43 Z" fill="currentColor"/>
      <path d="M46,55 L75,27" stroke="currentColor" stroke-width="11" stroke-linecap="square" fill="none"/>
      <path d="M46,59 L75,89" stroke="currentColor" stroke-width="11" stroke-linecap="square" fill="none"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1360" height="1180" fill="#FFFFFF"/>

  <!-- ===================== ROW 1 ===================== -->
  <!-- Panel A: Primary navbar logo -->
  <rect x="48" y="48" width="608" height="290" fill="#FFFFFF" stroke="#E5E9EF"/>
  <text x="80" y="90" font-size="11" letter-spacing="2" fill="#6B7280">PRIMARY &#8212; DESKTOP NAVBAR</text>
  <use href="#bk-color" x="80" y="150" width="64" height="64"/>
  <text x="160" y="197" font-size="34" font-weight="600">
    <tspan fill="#0B1F3A">Breeze</tspan><tspan fill="#C8102E">kings</tspan>
  </text>
  <text x="80" y="290" font-size="12" fill="#6B7280">Target: 190px wide &#215; 40px high in a 64&#8211;72px navbar</text>

  <!-- Panel B: Compact / mobile logo -->
  <rect x="704" y="48" width="608" height="290" fill="#FFFFFF" stroke="#E5E9EF"/>
  <text x="736" y="90" font-size="11" letter-spacing="2" fill="#6B7280">COMPACT &#8212; MOBILE HEADER</text>
  <use href="#bk-color" x="736" y="158" width="46" height="46"/>
  <text x="796" y="192" font-size="24" font-weight="600">
    <tspan fill="#0B1F3A">Breeze</tspan><tspan fill="#C8102E">kings</tspan>
  </text>
  <text x="736" y="290" font-size="12" fill="#6B7280">Target: 150px wide &#215; 34px high in a 48&#8211;56px mobile header</text>

  <!-- ===================== ROW 2 ===================== -->
  <!-- Panel C: Icon only -->
  <rect x="48" y="372" width="608" height="248" fill="#FFFFFF" stroke="#E5E9EF"/>
  <text x="80" y="414" font-size="11" letter-spacing="2" fill="#6B7280">ICON ONLY &#8212; APP / SOCIAL AVATAR</text>
  <use href="#bk-color" x="282" y="440" width="140" height="140"/>
  <text x="80" y="600" font-size="12" fill="#6B7280">1:1 square. Clear space on all sides &#8805; 20% of icon width.</text>

  <!-- Panel D: Favicon at real size -->
  <rect x="704" y="372" width="608" height="248" fill="#FFFFFF" stroke="#E5E9EF"/>
  <text x="736" y="414" font-size="11" letter-spacing="2" fill="#6B7280">FAVICON &#8212; ACTUAL SIZE</text>

  <rect x="736" y="470" width="220" height="220" fill="none"/>
  <use href="#bk-color" x="800" y="440" width="96" height="96"/>
  <text x="820" y="558" font-size="10" fill="#6B7280">8&#215; reference (not actual size)</text>

  <use href="#bk-color" x="950" y="460" width="32" height="32"/>
  <text x="936" y="512" font-size="10" fill="#6B7280">32px</text>
  <use href="#bk-color" x="1010" y="466" width="24" height="24"/>
  <text x="1000" y="512" font-size="10" fill="#6B7280">24px</text>
  <use href="#bk-color" x="1064" y="470" width="16" height="16"/>
  <text x="1054" y="512" font-size="10" fill="#6B7280">16px</text>

  <text x="736" y="600" font-size="12" fill="#6B7280">Verified legible from 16px. Do not add detail below 32px.</text>

  <!-- ===================== ROW 3 ===================== -->
  <!-- Panel E: Dark backgrounds -->
  <rect x="48" y="652" width="296" height="288" fill="#0B1F3A"/>
  <text x="76" y="694" font-size="11" letter-spacing="2" fill="#93A3BE">ON DARK NAVY</text>
  <use href="#bk-ondark" x="76" y="740" width="52" height="52"/>
  <text x="138" y="775" font-size="24" font-weight="600">
    <tspan fill="#FFFFFF">Breeze</tspan><tspan fill="#E8433D">kings</tspan>
  </text>

  <rect x="360" y="652" width="296" height="288" fill="#1C1F26"/>
  <text x="388" y="694" font-size="11" letter-spacing="2" fill="#9AA1AC">ON DARK CHARCOAL</text>
  <use href="#bk-ondark" x="388" y="740" width="52" height="52"/>
  <text x="450" y="775" font-size="24" font-weight="600">
    <tspan fill="#FFFFFF">Breeze</tspan><tspan fill="#E8433D">kings</tspan>
  </text>

  <!-- Panel F: Monochrome -->
  <rect x="704" y="652" width="608" height="288" fill="#FFFFFF" stroke="#E5E9EF"/>
  <text x="736" y="694" font-size="11" letter-spacing="2" fill="#6B7280">MONOCHROME</text>

  <use href="#bk-mono" x="736" y="726" width="40" height="40" color="#000000"/>
  <text x="786" y="754" font-size="20" font-weight="600" fill="#000000">Breezekings</text>
  <text x="736" y="782" font-size="10" fill="#6B7280">Solid black</text>

  <rect x="736" y="808" width="220" height="60" fill="#0B1F3A"/>
  <use href="#bk-mono" x="748" y="822" width="32" height="32" color="#FFFFFF"/>
  <text x="790" y="844" font-size="16" font-weight="600" fill="#FFFFFF">Breezekings</text>
  <text x="736" y="886" font-size="10" fill="#6B7280">Solid white (on dark)</text>

  <use href="#bk-mono" x="736" y="906" width="40" height="40" color="#0B1F3A"/>
  <text x="786" y="934" font-size="20" font-weight="600" fill="#0B1F3A">Breezekings</text>
  <text x="736" y="962" font-size="10" fill="#6B7280">Solid navy</text>

  <!-- ===================== SPEC STRIP ===================== -->
  <line x1="48" y1="988" x2="1312" y2="988" stroke="#E5E9EF"/>

  <rect x="48" y="1012" width="18" height="18" fill="#0B1F3A"/>
  <text x="76" y="1026" font-size="12" fill="#111827">Navy #0B1F3A</text>

  <rect x="240" y="1012" width="18" height="18" fill="#C8102E"/>
  <text x="268" y="1026" font-size="12" fill="#111827">Red #C8102E</text>

  <rect x="432" y="1012" width="18" height="18" fill="#E8433D"/>
  <text x="460" y="1026" font-size="12" fill="#111827">Coral #E8433D (dark-bg accent only)</text>

  <text x="48" y="1066" font-size="12" fill="#111827">Font: Inter / Plus Jakarta Sans / Manrope, weight 600 (semibold) &#8212; never bolder, never thinner than 500.</text>
  <text x="48" y="1090" font-size="12" fill="#111827">Minimum display size: icon 24px, full lockup 120px wide. Clear space = height of the icon on every side.</text>
  <text x="48" y="1114" font-size="12" fill="#111827">Navbar sizing: desktop 190&#215;40px, mobile 150&#215;34px. Icon and wordmark are optically centered on the same baseline midline.</text>
  <text x="48" y="1138" font-size="12" fill="#111827">No gold accent used &#8212; dropped as unnecessary for a two-color, high-contrast system.</text>

</svg>
